name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. 1.0.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: EdgeTTSFix/EdgeTTSFix/EdgeTTSFix.csproj
  CIPX: EdgeTTSFix/EdgeTTSFix/cipx/EdgeTTSFix.cipx

jobs:
  release:
    name: Build and release
    runs-on: windows-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # tag 必须与两个清单中的版本一致
      - name: Verify tag version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}".TrimStart('v')
          foreach ($file in @("EdgeTTSFix/EdgeTTSFix/manifest.yml", "EdgeTTSFix/EdgeTTSFix.yml")) {
            $match = Select-String -Path $file -Pattern '^version:\s*(.+)$'
            if (-not $match) {
              throw "Missing version in $file"
            }
            $version = $match.Matches[0].Groups[1].Value.Trim()
            if ($version -ne $tag) {
              throw "Tag '$tag' does not match version '$version' in $file."
            }
          }

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build and package
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore -p:CreateCipx=true -p:GenerateHashSummary=false

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path $env:CIPX)) {
            throw "Package not found: $env:CIPX"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:CIPX))
          try {
            $entries = $zip.Entries.FullName
            foreach ($required in @("manifest.yml", "EdgeTTSFix.dll", "Icon.ico")) {
              if ($entries -notcontains $required) {
                throw "Missing $required in package"
              }
            }
          }
          finally {
            $zip.Dispose()
          }

          $hash = (Get-FileHash $env:CIPX -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          "SHA256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: ${{ env.CIPX }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          overwrite_files: true
